[package]
name        = "salvage"
version     = "0.1.0"
edition      = "2024"
rust-version = "1.90"
description = "Fail-closed ClickHouse data salvage from a compromised cluster"
publish     = false

[dependencies]
clap                  = { version = "4", features = ["derive"] }
# The `tracing` integration is default-off and #[cfg]-gated; with the default `log` feature the
# level-filter conversion this crate relies on does not exist. Default marker is ErrorLevel.
clap-verbosity-flag   = { version = "3", default-features = false, features = ["tracing"] }
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
toml                  = "0.8"
thiserror             = "2"
tracing               = "0.1"
tracing-subscriber    = { version = "0.3", features = ["env-filter"] }
regex                 = "1"
num-bigint            = "0.4"
num-traits            = "0.2"
time                  = { version = "0.3", features = ["macros", "parsing", "formatting"] }
uuid                  = "1"
sha2                  = "0.10"
crc32c                = "0.6"
flate2                = "1"
tar                   = "0.4"
base64                = "0.22"
bs58                  = "0.5.1"
percent-encoding      = "2"
unicode-normalization = "0.1"
arrow-array           = { version = "56.2", features = ["chrono-tz"] }
arrow-cast            = "56.2"
arrow-schema          = { version = "56.2", features = ["serde"] }
parquet               = { version = "56.2", default-features = false, features = ["arrow", "snap", "flate2-zlib-rs", "lz4", "zstd"] }
aws-config            = "1"
aws-sdk-s3            = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
tokio                 = { version = "1", features = ["rt-multi-thread", "sync", "fs", "io-util", "time", "process"] }
futures               = "0.3"
rlimit                = "0.10"
# Automatic decompression is deliberately NOT enabled: the raw bytes are what we hash, and the
# "exactly one gzip member, no trailing bytes" check is impossible if the transport already
# decompressed. rustls rather than native-tls so there is no OpenSSL coupling on either host.
reqwest               = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile   = "3"
aws-smithy-http-client = { version = "1.1.9", features = ["test-util"] }
aws-smithy-types = "1.4.3"
http = "1"

[profile.release]
overflow-checks = true      # wrapping arithmetic in a bounds validator is a silent wrong answer
panic           = "unwind"  # explicit: Drop must run so no partial output survives a panic
debug           = 1         # symbols for a one-shot operation we cannot re-run

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Reachable panics are acceptable here, so the four panic-shaped lints are off.
#
# This does not weaken the fail-closed guarantee, because a panic is already handled rather than
# merely forbidden: `panic = "unwind"` is pinned in the release profile, `main` wraps dispatch in
# `catch_unwind`, and a caught unwind maps to `ExitCode::Abort` -- a finding, exit 1. Unwinding is
# what runs the `Drop` impls, so `PartialOutput` still unlinks the in-progress file and no partial
# output survives. `abort.rs` has a test that proves exactly that path.
#
# What we give up is the compiler forcing every fallible step to be spelled out. That mattered most
# on the parse path, so prefer `?` over `unwrap` in the hostile-input modules by convention.
unwrap_used      = "allow"
expect_used      = "allow"
panic            = "allow"
indexing_slicing = "allow"
# Denied per-module in the parsing and bounds code, where a wrap or a lossy cast is a wrong answer
# rather than a style question. Crate-wide would drown the I/O and CLI code in noise.
arithmetic_side_effects = "allow"
as_conversions          = "allow"
integer_division        = "allow"
